<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>풀밭 뱀</title>
<style>
  :root{ --bg:#10201a; --field:#16302a; --line:#1d3b33; --ink:#e9f2d8; --dim:#8fa893; --snake:#b6e04a; --head:#e8ff8a; --food:#ff6b4a; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:"Trebuchet MS","Malgun Gothic","Apple SD Gothic Neo",sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:12px; touch-action:none; user-select:none; -webkit-user-select:none; }
  h1{ margin:0; font-size:22px; letter-spacing:.18em; font-weight:700; }
  .bar{ display:flex; gap:22px; font-size:14px; color:var(--dim); }
  .bar b{ color:var(--ink); font-size:18px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .wrap{ position:relative; width:min(92vw, 62vh, 520px); aspect-ratio:1; }
  canvas{ width:100%; height:100%; display:block; background:var(--field); border:2px solid var(--line); border-radius:6px; }
  .msg{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(16,32,26,.82); text-align:center; border-radius:6px; padding:16px; }
  .msg[hidden]{ display:none; }
  .msg strong{ font-size:24px; }
  .msg span{ font-size:14px; color:var(--dim); line-height:1.6; }
  button{ font:inherit; color:var(--bg); background:var(--snake); border:0; padding:10px 22px; font-weight:700; border-radius:4px; cursor:pointer; }
  button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .pad{ display:none; grid-template-columns:repeat(3, 58px); grid-template-rows:repeat(2, 58px); gap:6px; }
  .pad button{ padding:0; font-size:20px; background:#24463c; color:var(--ink); }
  .pad .u{ grid-column:2; } .pad .l{ grid-column:1; grid-row:2; } .pad .d{ grid-column:2; grid-row:2; } .pad .r{ grid-column:3; grid-row:2; }
  @media (pointer:coarse){ .pad{ display:grid; } .wrap{ width:min(92vw, 50vh, 520px); } }
  .help{ font-size:12.5px; color:var(--dim); }
</style>
</head>
<body>
  <h1>풀밭 뱀</h1>
  <div class="bar"><span>점수<b id="score">0</b></span><span>최고<b id="best">0</b></span><span>속도<b id="speed">1</b></span></div>
  <div class="wrap">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="msg" id="msg">
      <strong id="msgTitle">풀밭 뱀</strong>
      <span id="msgText">먹이를 먹을수록 길어지고 빨라집니다.<br>벽이나 자기 몸에 부딪히면 끝납니다.</span>
      <button id="startBtn" type="button">시작</button>
    </div>
  </div>
  <div class="pad" aria-label="방향 버튼">
    <button class="u" data-d="0,-1" type="button" aria-label="위">▲</button>
    <button class="l" data-d="-1,0" type="button" aria-label="왼쪽">◀</button>
    <button class="d" data-d="0,1" type="button" aria-label="아래">▼</button>
    <button class="r" data-d="1,0" type="button" aria-label="오른쪽">▶</button>
  </div>
  <div class="help">방향키 또는 WASD: 이동 / Space: 일시정지 / 화면 밀기도 가능</div>

<script>
const N = 20, C = 480 / N;
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const $ = id => document.getElementById(id);
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
let snake, dir, queue, food, score, best = 0, alive = false, paused = false, timer = null, tick = 150;
try { best = +localStorage.getItem('snake-best') || 0; } catch (_) {}
$('best').textContent = best;

function placeFood() {
  const free = [];
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}
function start() {
  snake = [{ x:9, y:10 }, { x:8, y:10 }, { x:7, y:10 }];
  dir = { x:1, y:0 }; queue = []; score = 0; tick = 150; alive = true; paused = false;
  placeFood(); $('msg').hidden = true; hud(); loop();
}
function hud() { $('score').textContent = score; $('speed').textContent = Math.round((150 - tick) / 10) + 1; }
function loop() { clearTimeout(timer); if (!alive || paused) return; step(); draw(); timer = setTimeout(loop, tick); }
function turn(x, y) {
  if (!alive || paused) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((last.x === x && last.y === y) || (last.x === -x && last.y === -y)) return;
  if (queue.length < 2) queue.push({ x, y });
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = { x:snake[0].x + dir.x, y:snake[0].y + dir.y };
  const eat = food && h.x === food.x && h.y === food.y;
  const body = eat ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) return over();
  snake.unshift(h);
  if (eat) { score += 10; tick = Math.max(60, tick - 4); placeFood(); hud(); if (!food) return over(true); }
  else snake.pop();
}
function over(win) {
  alive = false; clearTimeout(timer);
  if (score > best) { best = score; try { localStorage.setItem('snake-best', best); } catch (_) {} $('best').textContent = best; }
  $('msgTitle').textContent = win ? '풀밭을 가득 채웠습니다' : '게임 끝';
  $('msgText').innerHTML = `점수 ${score}점<br>최고 ${best}점`;
  $('startBtn').textContent = '다시 하기'; $('msg').hidden = false; draw();
}
function togglePause() {
  if (!alive) return;
  paused = !paused;
  if (paused) { $('msgTitle').textContent = '일시정지'; $('msgText').textContent = 'Space 또는 버튼으로 계속합니다'; $('startBtn').textContent = '계속'; $('msg').hidden = false; }
  else { $('msg').hidden = true; loop(); }
}
function draw() {
  g.fillStyle = css('--field'); g.fillRect(0, 0, 480, 480);
  g.fillStyle = css('--line');
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x + y) % 2) g.fillRect(x * C, y * C, C, C);
  if (food) { g.fillStyle = css('--food'); g.beginPath(); g.arc(food.x * C + C / 2, food.y * C + C / 2, C * 0.36, 0, 7); g.fill(); }
  snake.forEach((s, i) => {
    g.fillStyle = i ? css('--snake') : css('--head');
    const p = i ? 2 : 1; g.fillRect(s.x * C + p, s.y * C + p, C - p * 2, C - p * 2);
  });
  const h = snake[0]; g.fillStyle = css('--bg');
  const ex = h.x * C + C / 2 + dir.x * 5, ey = h.y * C + C / 2 + dir.y * 5;
  g.fillRect(ex - 2 + dir.y * 5, ey - 2 + dir.x * 5, 4, 4); g.fillRect(ex - 2 - dir.y * 5, ey - 2 - dir.x * 5, 4, 4);
}
addEventListener('keydown', e => {
  const k = { ArrowUp:[0, -1], KeyW:[0, -1], ArrowDown:[0, 1], KeyS:[0, 1], ArrowLeft:[-1, 0], KeyA:[-1, 0], ArrowRight:[1, 0], KeyD:[1, 0] }[e.code];
  if (k) { e.preventDefault(); turn(k[0], k[1]); }
  if (e.code === 'Space') { e.preventDefault(); if (alive) togglePause(); else start(); }
  if (e.code === 'Enter' && !alive) start();
});
$('startBtn').addEventListener('click', () => { if (alive && paused) togglePause(); else start(); });
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = b.dataset.d.split(',').map(Number); turn(x, y); }));
let sw = null;
cv.addEventListener('pointerdown', e => { sw = { x:e.clientX, y:e.clientY }; });
addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
snake = [{ x:9, y:10 }, { x:8, y:10 }, { x:7, y:10 }]; dir = { x:1, y:0 }; food = { x:14, y:10 }; draw();
</script>
</body>
</html>
